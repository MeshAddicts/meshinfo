services:
  postgres:
    image: postgres:latest
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
    restart: always

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:latest
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/config:/mosquitto/config:rw
    restart: always

  meshinfo:
    image: ghcr.io/Meshaddicts/meshinfo:latest
    volumes:
      - ./config.json:/app/config.json
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - 9000:9000
    restart: always
    depends_on:
      - postgres
      - mqtt

  frontend:
    image: ghcr.io/Meshaddicts/meshinfo-spa:latest
    ports:
      - "8000:80"
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: /api

      # Optional: Mapbox basemap
      VITE_MAP_PROVIDER: mapbox
      # VITE_MAPBOX_STYLE: mapbox/streets-v12
      # VITE_MAPBOX_TOKEN: pk_XXXXXXXXXXXXXXXXXXXX
    restart: always

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy/data:/data/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./output/static-html:/srv
      - ./public/images:/srv/images
    environment:
      - CADDY_AGREE=true
    restart: always
    depends_on:
      - meshinfo
      - frontend
