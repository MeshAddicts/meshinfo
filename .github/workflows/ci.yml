name: Continuous Integration Build

on:
  pull_request:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
      - name: Enable yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn
        working-directory: ./frontend
      - name: Run build
        run: yarn build
        working-directory: ./frontend
