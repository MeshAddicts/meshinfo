name: Tests

on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      # Tests import real modules at collection time, so runtime deps are needed.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      # Corepack picks the yarn version up from frontend/package.json `packageManager`.
      - run: corepack enable
      - run: yarn install
      - run: yarn tsc --noEmit
      - run: yarn test
      # Production bundle — catches asset/dynamic-import issues vitest doesn't.
      - run: yarn build
