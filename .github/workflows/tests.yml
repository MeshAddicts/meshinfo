name: Tests

on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install --upgrade pip
      # Tests import real modules at collection time, so runtime deps are needed.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  image-build:
    name: Image Build (${{ matrix.arch }})
    # Pushes to develop build and publish the image in docker.yml.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=main-${{ matrix.arch }}

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Corepack picks the yarn version up from frontend/package.json `packageManager`.
      - run: corepack enable
      - run: yarn install
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test
      # Production bundle — catches asset/dynamic-import issues vitest doesn't.
      - run: yarn build
