name: Tests

on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pytest-cov
      - run: python -m pytest -q tests

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "25"
      # Corepack picks up the yarn version from frontend/package.json `packageManager` field.
      - run: corepack enable
      - run: yarn install
      - run: yarn tsc --noEmit
      - run: yarn test
      # Production bundle check — catches issues vitest doesn't (asset paths,
      # dynamic imports, rollup tree-shake). Replaces the now-deleted ci.yml.
      - run: yarn build
