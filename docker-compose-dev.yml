services:
  caddy:
    image: caddy:latest
    ports:
      - 8000:80
    volumes:
      - ./caddy/data:/data/caddy
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - ./public/images:/srv/images
    environment:
      - CADDY_AGREE=true
    restart: unless-stopped

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: meshinfo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - meshinfo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meshinfo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:latest
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/config:/mosquitto/config:rw
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.spa.dev
    ports:
      - 5173:5173
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_API_PROXY_TARGET=http://meshinfo:9000
      - NODE_ENV=dev
    restart: unless-stopped

  meshinfo:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config.toml:/app/config.toml
      - ./output:/app/output
      - ./postgres:/app/postgres:ro
    ports:
      - 9000:9000
    environment:
      - PYTHONUNBUFFERED="1"
      - ALLOW_ORIGINS="*"
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  meshinfo_pgdata: